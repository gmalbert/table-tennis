name: Nightly Predictions

concurrency:
  group: frontier-audit-store
  cancel-in-progress: false

on:
  schedule:
    # Run at 05:00 UTC every day — before most morning fixtures start.
    - cron: "0 5 * * *"
  workflow_dispatch:   # allow manual trigger from the Actions tab

jobs:
  precompute:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push the enriched JSON back to the repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install requests tqdm playwright pandas

      - name: Install Playwright Chromium (+ system deps)
        run: playwright install chromium --with-deps

      - name: Download tt.db from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p processed
          gh release download db-latest \
            --repo gmalbert/table-tennis \
            --pattern tt.db \
            --dir processed \
            --clobber

      - name: Restore append-only audit store
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download frontier-latest \
            --repo gmalbert/table-tennis \
            --pattern frontier_audit.db \
            --dir processed \
            --clobber || python scripts/init_frontier_store.py

      - name: Compute date range (today → today+3)
        id: dates
        run: |
          python - <<'EOF'
          import os
          from datetime import date, timedelta
          today = date.today()
          end   = today + timedelta(days=3)
          env_file = os.environ["GITHUB_ENV"]
          with open(env_file, "a") as f:
              f.write(f"SOFA_START={today}\n")
              f.write(f"SOFA_END={end}\n")
          EOF

      - name: Scrape upcoming fixtures from SofaScore
        env:
          HEADLESS: "1"
        run: |
          echo "Fetching SofaScore $SOFA_START → $SOFA_END"
          python scripts/tt_scraper.py sofa \
            --start "$SOFA_START" \
            --end   "$SOFA_END"   \
            --no-stats
        continue-on-error: true

      - name: Scrape upcoming fixtures from Flashscore
        env:
          HEADLESS: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          echo "Fetching Flashscore $SOFA_START → $SOFA_END"
          python scripts/tt_scraper.py flash \
            --start "$SOFA_START" \
            --end   "$SOFA_END"

      - name: Pre-compute enriched predictions
        run: |
          python scripts/audit_data_quality.py
          python scripts/settle_predictions.py
          python scripts/tt_precompute.py

      - name: Publish append-only audit store
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view frontier-latest --repo gmalbert/table-tennis >/dev/null 2>&1 || \
            gh release create frontier-latest --repo gmalbert/table-tennis \
              --title "Frontier audit store" --notes "Append-only odds and forecast archive"
          gh release upload frontier-latest processed/frontier_audit.db \
            --repo gmalbert/table-tennis --clobber

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed/upcoming_enriched.json
          if git diff --staged --quiet; then
            echo "No new data — nothing to commit."
          else
            TODAY=$(date -u +%Y-%m-%d)
            git commit -m "data: nightly predictions refresh $TODAY [skip ci]"
            git push
          fi

      - name: Export best bets for Sports Picks Grid
        run: python scripts/export_best_bets.py
        continue-on-error: true

      - name: Commit best_bets_today.json
        run: |
          git add data_files/best_bets_today.json || true
          if git diff --staged --quiet; then
            echo "No best_bets changes to commit."
          else
            git commit -m "chore: update best_bets_today [skip ci]"
            git push
          fi
        continue-on-error: true

      - name: Send configured paper-pick notifications
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EMAIL_WEBHOOK_URL: ${{ secrets.EMAIL_WEBHOOK_URL }}
        run: python scripts/notify_picks.py --discord-only
        continue-on-error: true
