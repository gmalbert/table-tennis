name: Flashscore Daily Collection

on:
  schedule:
    # Runs Monday and Thursday at 06:00 UTC.
    # 5-day lookback per run → 1-day overlap on each side, so a single missed
    # run never creates a gap in the 7-day rolling API window.
    - cron: "0 6 * * 1"   # Monday
    - cron: "0 6 * * 4"   # Thursday
  workflow_dispatch:       # allow manual trigger from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to push data files back to the repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install requests tqdm

      - name: Compute date range (last 5 days → today)
        id: dates
        run: |
          python - <<'EOF'
          import os
          from datetime import date, timedelta
          today = date.today()
          start = today - timedelta(days=5)
          env_file = os.environ["GITHUB_ENV"]
          with open(env_file, "a") as f:
              f.write(f"FLASH_START={start}\n")
              f.write(f"FLASH_END={today}\n")
          EOF

      - name: Scrape Flashscore
        env:
          HEADLESS: "1"
        run: |
          echo "Fetching Flashscore $FLASH_START → $FLASH_END"
          python scripts/tt_scraper.py flash \
            --start "$FLASH_START" \
            --end   "$FLASH_END"   \
            --no-detail

      - name: Commit and push new data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/flashscore/
          # Only commit if there is something new
          if git diff --staged --quiet; then
            echo "No new data — nothing to commit."
          else
            git commit -m "data(flashscore): add matches $FLASH_START → $FLASH_END [skip ci]"
            git push
          fi
