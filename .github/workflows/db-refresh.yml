name: Database Refresh

on:
  schedule:
    # Run daily at 04:30 UTC to refresh the release DB from committed raw data.
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  refresh-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install pandas tqdm requests

      - name: Authenticate GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | gh auth login --with-token

      - name: Build processed database
        run: |
          python scripts/tt_processor.py --resume
          python scripts/tt_build_db.py

      - name: Publish tt.db to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_db.py --skip-build
