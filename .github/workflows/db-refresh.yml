name: Database Refresh

on:
  schedule:
    # Run daily at 04:30 UTC to refresh the release DB from live scraper data.
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  refresh-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install pandas tqdm requests playwright
          playwright install chromium --with-deps

      - name: Compute scrape date ranges
        id: dates
        run: |
          python - <<'EOF'
          import os
          from datetime import date, timedelta
          today = date.today()
          sofa_start = today - timedelta(days=7)
          flash_start = today - timedelta(days=5)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"SOFA_START={sofa_start}\n")
              f.write(f"SOFA_END={today}\n")
              f.write(f"FLASH_START={flash_start}\n")
              f.write(f"FLASH_END={today}\n")
          EOF

      - name: Scrape SofaScore raw data
        env:
          HEADLESS: "1"
        run: |
          python scripts/tt_scraper.py sofa \
            --start "$SOFA_START" \
            --end "$SOFA_END" \
            --no-stats

      - name: Scrape Flashscore raw data
        env:
          HEADLESS: "1"
        run: |
          python scripts/tt_scraper.py flash \
            --start "$FLASH_START" \
            --end "$FLASH_END" \
            --no-detail

      - name: Build processed database
        run: |
          python scripts/tt_processor.py --resume
          python scripts/tt_build_db.py

      - name: Publish tt.db to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_db.py --skip-build
